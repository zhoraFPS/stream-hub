version: '3.8'

services:
  stream-hub:
    build: .
    container_name: stream-hub
    restart: unless-stopped
    ports:
      - "5000:5000"
      - "5443:5443"
    environment:
      - PORT=5000
      - HTTPS_PORT=5443
      - NODE_ENV=production
      # Ohne diese Variable erzeugt der Server beim ersten Start selbst einen
      # Schlüssel unter server/data/.jwt-secret. Ein fester Wert hier ist besser:
      # dann hängen die Sitzungen nicht am Volume.
      # - JWT_SECRET=bitte-einen-langen-zufallswert-eintragen
      #
      # Aufbereitung über die Intel-GPU statt der CPU. /dev/dri ist unten schon
      # durchgereicht. Erst einschalten, wenn ein Testupload damit durchläuft —
      # ohne passenden Treiber schlägt jeder Auftrag fehl.
      # - TRANSCODE_HWACCEL=vaapi
    volumes:
      - ./server/data:/app/server/data
    devices:
      - /dev/dri:/dev/dri

  mediamtx:
    image: bluenviron/mediamtx:latest-ffmpeg
    restart: always
    ports:
      - "1936:1935"   # RTMP
      - "8889:8889"   # WebRTC (WHEP/WHIP)
      - "8888:8888"   # HLS (Fallback)
      - "8189:8189/udp" # WebRTC ICE UDP
      - "8189:8189/tcp" # WebRTC ICE TCP
    environment:
      - MTX_WEBRTCADDITIONALHOSTS=192.168.178.69
    volumes:
      - ./server/mediamtx.yml:/mediamtx.yml
      - ./server/on_publish.sh:/on_publish.sh
