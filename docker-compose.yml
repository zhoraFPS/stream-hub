version: '3.8'

services:
  stream-hub:
    build: .
    container_name: stream-hub
    restart: unless-stopped
    ports:
      - "5000:5000"
    environment:
      - PORT=5000
      - NODE_ENV=production
    volumes:
      - ./server/data:/app/server/data
    devices:
      # Proxmox / Intel NUC GPU Passthrough for Hardware Accelerated Decoding & Transcoding
      - /dev/dri:/dev/dri
