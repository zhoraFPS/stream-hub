version: '3.8'

services:
  stream-hub:
    build: .
    container_name: stream-hub
    restart: unless-stopped
    ports:
      - "5000:5000"
      - "5443:5443"
    environment:
      - PORT=5000
      - HTTPS_PORT=5443
      - NODE_ENV=production
    volumes:
      - ./server/data:/app/server/data
    devices:
      - /dev/dri:/dev/dri

  mediamtx:
    image: bluenviron/mediamtx:latest-ffmpeg
    restart: always
    ports:
      - "1936:1935"   # RTMP
      - "8889:8889"   # WebRTC (WHEP/WHIP)
      - "8888:8888"   # HLS (Fallback)
      - "8189:8189/udp" # WebRTC ICE UDP
      - "8189:8189/tcp" # WebRTC ICE TCP
    environment:
      - MTX_WEBRTCADDITIONALHOSTS=192.168.178.69
    volumes:
      - ./server/mediamtx.yml:/mediamtx.yml
      - ./server/on_publish.sh:/on_publish.sh
