webrtcAdditionalHosts:
  - 192.168.178.69

# ── Low-Latency HLS ────────────────────────────
# Segment duration: 1s (statt default 6s)
# Part duration: 0.2s (LL-HLS, Chunked Transfer)
# → Ziel-Latenz: ~1-2 Sekunden (wie Twitch)
hlsSegmentDuration: 1s
hlsPartDuration: 0.2s
hlsSegmentMaxSize: 50MB
hlsAllowOrigin: '*'

paths:
  all_others:
    runOnAvailable: sh /on_publish.sh
    runOnAvailableRestart: no
