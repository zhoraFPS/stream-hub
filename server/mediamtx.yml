webrtcAdditionalHosts:
  - 192.168.178.69

# ── Low-Latency HLS ────────────────────────────
hlsSegmentDuration: 1s
hlsPartDuration: 0.2s
hlsSegmentMaxSize: 50MB
hlsAllowOrigin: '*'

# ── HTTP Auth for Stream Keys ──────────────────
authMethod: http
authHTTPAddress: http://stream-hub:5000/api/internal/stream-auth

paths:
  all_others:
    runOnAvailable: sh /on_publish.sh
    runOnAvailableRestart: no
