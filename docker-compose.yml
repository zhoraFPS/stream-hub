version: '3.8'

services:
  stream-hub:
    build: .
    container_name: stream-hub
    restart: unless-stopped
    ports:
      - "5000:5000"
      - "5443:5443"
    environment:
      - PORT=5000
      - HTTPS_PORT=5443
      - NODE_ENV=production
    volumes:
      - ./server/data:/app/server/data
    devices:
      - /dev/dri:/dev/dri

  mediamtx:
    image: bluenviron/mediamtx:latest
    container_name: mediamtx
    restart: unless-stopped
    ports:
      - "1936:1935"   # RTMP (Geändert von 1935 auf 1936)
      - "8889:8889"   # WebRTC (WHEP/WHIP)
      - "8888:8888"   # HLS (Fallback)
      - "8189:8189"   # WebRTC UDP
    environment:
      - MTX_WEBRTCADDITIONALHOSTS=192.168.178.69
      - MTX_API=yes
      - MTX_APIADDRESS=:9997
      - MTX_AUTHINTERNALUSERS_0_USER=any
      - MTX_AUTHINTERNALUSERS_0_PERMISSIONS_0_ACTION=api
      - MTX_AUTHINTERNALUSERS_0_PERMISSIONS_1_ACTION=read
      - MTX_AUTHINTERNALUSERS_0_PERMISSIONS_2_ACTION=publish
