version: '3.8'

services:
  stream-hub:
    build: .
    container_name: stream-hub
    restart: unless-stopped
    ports:
      - "5000:5000"
      - "5443:5443"
      - "1935:1935"
    environment:
      - PORT=5000
      - HTTPS_PORT=5443
      - NODE_ENV=production
    volumes:
      - ./server/data:/app/server/data
    devices:
      - /dev/dri:/dev/dri
